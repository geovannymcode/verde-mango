server:
  port: 8080

spring:
  application:
    name: verde-mango

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:verdemango_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: VerdeMangoHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Docker Compose (levanta postgres/redis/rabbitmq automaticamente en desarrollo)
  docker:
    compose:
      enabled: true
      file: infrastructure/docker-compose.yml
      lifecycle-management: start_and_stop
      stop:
        command: stop

  # Spring Modulith Event Publication Registry
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      completion-mode: update
      republish-outstanding-events-on-restart: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:verdemango-super-secret-key-2026-development-only-do-not-use-in-prod}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  issuer: verde-mango-auth

# Module-specific configuration
# Auth
auth:
  password-reset-expiration: 3600000

# Catalog (Product)
product:
  low-stock-threshold: 5
  featured-products-limit: 8
  related-products-limit: 4
  max-images-per-product: 10

# Orders
order:
  cart-expiration-hours: 24
  cancellation-window-hours: 2
  tax-rate: 0.19
  default-shipping-cost: 12000

# Recipes
recipe:
  featured-limit: 6
  popular-limit: 10
  view-throttle-seconds: 300

# Payment / Wompi
wompi:
  environment: ${WOMPI_ENVIRONMENT:sandbox}
  sandbox:
    public-key: ${WOMPI_SANDBOX_PUBLIC_KEY:pub_stagtest_xxx}
    private-key: ${WOMPI_SANDBOX_PRIVATE_KEY:prv_stagtest_xxx}
    events-secret: ${WOMPI_SANDBOX_EVENTS_SECRET:stagtest_events_xxx}
    integrity-secret: ${WOMPI_SANDBOX_INTEGRITY_SECRET:stagtest_integrity_xxx}
  production:
    public-key: ${WOMPI_PRODUCTION_PUBLIC_KEY:pub_prod_xxx}
    private-key: ${WOMPI_PRODUCTION_PRIVATE_KEY:prv_prod_xxx}
    events-secret: ${WOMPI_PRODUCTION_EVENTS_SECRET:prod_events_xxx}
    integrity-secret: ${WOMPI_PRODUCTION_INTEGRITY_SECRET:prod_integrity_xxx}
  api-url:
    sandbox: https://sandbox.wompi.co/v1
    production: https://production.wompi.co/v1
  checkout-url:
    sandbox: https://checkout.wompi.co/l/
    production: https://checkout.wompi.co/l/
  currency: COP
  expiration-minutes: 30
  redirect-url: ${FRONTEND_URL:http://localhost:3000}/payment/result

payment:
  reference-prefix: VM
  max-retry-attempts: 3
  timeout-minutes: 30

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    com.geovannycode: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
